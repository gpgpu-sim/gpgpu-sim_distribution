name: PR Review Nudge

on:
  schedule:
    - cron: '0 14 * * 1,4'   # Mon + Thu 14:00 UTC
  workflow_dispatch:
    inputs:
      stale_days:
        description: "Days of inactivity before nudging"
        required: false
        default: "3"

permissions:
  pull-requests: write
  issues: write

jobs:
  nudge:
    runs-on: tgrogers-raid
    steps:
      - name: Find stale PRs and nudge
        uses: actions/github-script@v7
        env:
          STALE_DAYS: ${{ inputs.stale_days || '3' }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const staleDays = Number(process.env.STALE_DAYS || '3');
            const now = Date.now();
            const staleMs = staleDays * 24 * 60 * 60 * 1000;

            // List open issues with label 'awaiting-human-review' (PRs are issues).
            const prs = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo,
              state: 'open',
              labels: 'awaiting-human-review',
              per_page: 100,
            });

            const prNumbers = prs.filter(i => i.pull_request).map(i => i.number);
            core.info(`Found ${prNumbers.length} PR(s) with 'awaiting-human-review'.`);

            for (const num of prNumbers) {
              const pr = (await github.rest.pulls.get({ owner, repo, pull_number: num })).data;
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner, repo, pull_number: num, per_page: 100,
              });

              const substantiveReview = reviews.find(r =>
                r.state === 'APPROVED' || r.state === 'CHANGES_REQUESTED'
              );

              if (substantiveReview) {
                // Reviewed — clean up labels.
                for (const lbl of ['awaiting-human-review', 'stale-review']) {
                  try {
                    await github.rest.issues.removeLabel({ owner, repo, issue_number: num, name: lbl });
                  } catch (_) {}
                }
                core.info(`PR #${num}: reviewed, labels cleaned.`);
                continue;
              }

              // Compute age since most recent relevant event.
              const candidates = [pr.created_at, pr.updated_at];
              for (const r of reviews) candidates.push(r.submitted_at);
              const last = Math.max(...candidates.map(t => new Date(t).getTime()));
              const ageMs = now - last;
              const ageDays = (ageMs / (24 * 60 * 60 * 1000)).toFixed(1);

              if (ageMs < staleMs) {
                core.info(`PR #${num}: ${ageDays}d old, under threshold ${staleDays}d, skipping.`);
                continue;
              }

              // Build mention list from requested reviewers.
              const { users: reqUsers = [], teams: reqTeams = [] } =
                (await github.rest.pulls.listRequestedReviewers({ owner, repo, pull_number: num })).data;

              const mentions = [
                ...reqUsers.map(u => `@${u.login}`),
                ...reqTeams.map(t => `@${owner}/${t.slug}`),
              ].join(' ') || '(no reviewer currently requested)';

              await github.rest.issues.createComment({
                owner, repo, issue_number: num,
                body: `👋 ${mentions} — friendly ping: this PR has been waiting for review for ${ageDays} days. Let the author know if you're blocked or need to reassign.`,
              });
              await github.rest.issues.addLabels({
                owner, repo, issue_number: num,
                labels: ['stale-review'],
              });
              core.info(`PR #${num}: nudged at ${ageDays}d.`);
            }
