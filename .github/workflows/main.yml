# GPGPU-Sim regression: PTX execution-driven PASS/FAIL on self-checking apps.
#
# Runs entirely on GitHub-hosted runners (free for public repos). No self-hosted
# runners, no secrets. Everything fetched at run time is pinned (container image,
# Accel-Sim tools ref) so the gate only changes when this file changes.

name: CI Tests

on:
  push:
    branches-ignore:
      - "gh-readonly-queue**"
  # A PR from a fork does not fire `push` in this repo, so this is needed for
  # outside contributions to get CI at all.
  pull_request:
  workflow_dispatch:
  # Weekly canary: catches rot in the image, runner OS, or actions even when
  # nobody is pushing. GitHub disables schedules after 60 days of repo inactivity.
  schedule:
    - cron: "0 12 * * 1"

permissions:
  contents: read

# Pinned external inputs (edit here when bumping; `container:` cannot read `env`):
#   image:   ghcr.io/accel-sim/accel-sim-framework:ubuntu-24.04-cuda-12.8-minimal
#            CUDA 12.8 + prebuilt gpu-app-collection (rodinia_2.0-ft bins + data)
#            under $GPUAPPS_ROOT. TODO: replace tag with its @sha256 digest, and
#            later mirror it under ghcr.io/gpgpu-sim/.
#   Accel-Sim: commit d930ad6 on dev (v2.0.0 plus the slurm.sim revert, #556,
#            without which `-l local` jobs write no output). Used for
#            run_simulations.py / monitor_func_test.py and for the Accel-Sim
#            compatibility build. Move to the next tag once one includes #556.

# Runner: public repos use GitHub-hosted ubuntu-latest (free). Private copies use
# the self-hosted runner named by the org/repo variable PRIVATE_RUNNER_LABEL
# (e.g. aamodt-pc20 in ubc-aamodt-group); if it is unset they fall back to
# ubuntu-latest and bill the org's Actions minutes.

jobs:
  check-format:
    runs-on: ${{ github.event.repository.private && vars.PRIVATE_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - name: Check code formatting (clang-format 16.0.6)
        run: |
          python3 -m venv /tmp/cf
          source /tmp/cf/bin/activate
          pip install --quiet clang-format==16.0.6
          /bin/bash ./format-code.sh
          if git diff --quiet; then
            echo "Code is properly formatted"
          else
            echo "Code formatting check failed. Files needing formatting:"
            git diff --name-only
            echo "Run: pip install clang-format==16.0.6 && ./format-code.sh"
            exit 1
          fi

  build-CMake:
    needs: [check-format]
    runs-on: ${{ github.event.repository.private && vars.PRIVATE_RUNNER_LABEL || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        app:
          - rodinia_2.0-ft
        config:
          - TITANV
          - TITANV-LOCALXBAR
          - QV100
          - RTX2060
          - RTX3070
    name: build-CMake (${{ matrix.config }}, ${{ matrix.app }})
    container:
      image: ghcr.io/accel-sim/accel-sim-framework:ubuntu-24.04-cuda-12.8-minimal
      env:
        CONFIG: ${{ matrix.config }}
        APP: ${{ matrix.app }}
        ACCELSIM_REF: d930ad6d02c09bb56867132583735aba0389cff4
    steps:
      - uses: actions/checkout@v7
      - name: Build and run PTX simulations
        run: /bin/bash $GITHUB_WORKSPACE/short-tests-cmake.sh
      - name: Clean workspace (root-owned files from the container)
        if: always()
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete

  build-AccelSim:
    needs: [check-format]
    runs-on: ${{ github.event.repository.private && vars.PRIVATE_RUNNER_LABEL || 'ubuntu-latest' }}
    name: build-AccelSim (compatibility)
    container:
      image: ghcr.io/accel-sim/accel-sim-framework:ubuntu-24.04-cuda-12.8-minimal
      env:
        ACCELSIM_REPO: https://github.com/accel-sim/accel-sim-framework.git
        ACCELSIM_BRANCH: d930ad6d02c09bb56867132583735aba0389cff4
    steps:
      - uses: actions/checkout@v7
      - name: Build Accel-Sim against this GPGPU-Sim and run SASS traces
        run: /bin/bash $GITHUB_WORKSPACE/short-tests-accelsim.sh
      - name: Clean workspace (root-owned files from the container)
        if: always()
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete

  # Single stable check name to require in branch protection.
  CI-Success:
    if: always()
    needs: [check-format, build-CMake, build-AccelSim]
    runs-on: ${{ github.event.repository.private && vars.PRIVATE_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: All required jobs passed
        run: |
          echo 'check-format:   ${{ needs.check-format.result }}'
          echo 'build-CMake:    ${{ needs.build-CMake.result }}'
          echo 'build-AccelSim: ${{ needs.build-AccelSim.result }}'
          test '${{ needs.check-format.result }}'   = success
          test '${{ needs.build-CMake.result }}'    = success
          test '${{ needs.build-AccelSim.result }}' = success
